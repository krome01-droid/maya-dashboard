# ============================================
# MAYA Dashboard — Docker Compose (Hostinger VPS)
# Image pré-buildée sur GHCR via GitHub Actions
# ============================================

services:
  maya-dashboard:
    image: ghcr.io/krome01-droid/maya-dashboard:latest
    pull_policy: always
    container_name: maya-dashboard
    restart: unless-stopped
    ports:
      - "3850:3850"
    environment:
      - NODE_ENV=production
      - PORT=3850
      - HOSTNAME=0.0.0.0

      # NextAuth
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}

      # Compte de service local (accès sans Supabase Auth)
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}

      # Base de la marketplace (lecture service_role)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}

      # CROME OS — hub de publication et studio d'images
      - CROME_INGEST_URL=${CROME_INGEST_URL}
      - CROME_INGEST_SECRET=${CROME_INGEST_SECRET}

      # Le dashboard en a besoin autant que le cron : c'est lui qui vérifie
      # l'en-tête Bearer, et son absence fait répondre 500 aux routes /api/cron.
      - CRON_SECRET=${CRON_SECRET}

      # IA
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

      # Brief quotidien
      - RESEND_API_KEY=${RESEND_API_KEY}
      - BRIEF_TO=${BRIEF_TO}
      - BRIEF_FROM=${BRIEF_FROM}
    healthcheck:
      # 127.0.0.1 et non localhost : dans l'image, localhost résout d'abord en
      # [::1], or le serveur Next n'écoute qu'en IPv4 (HOSTNAME=0.0.0.0). wget
      # recevait « connection refused », le conteneur restait unhealthy, et
      # maya-cron — qui attend service_healthy — ne démarrait jamais.
      test:
        ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
         "http://127.0.0.1:3850/admin-maya/api/auth/session"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Image pré-construite, pas `build: ./cron` : Hostinger ne récupère que ce
  # fichier, pas le dépôt. Un contexte de build local n'existe pas sur le VPS
  # et fait échouer la création du projet entier, sans message.
  maya-cron:
    image: ghcr.io/krome01-droid/maya-cron:latest
    pull_policy: always
    container_name: maya-cron
    restart: unless-stopped
    depends_on:
      maya-dashboard:
        condition: service_healthy
    environment:
      - TZ=Europe/Paris
      - CRON_SECRET=${CRON_SECRET}
      # Réseau interne Compose : le cron ne sort pas sur Internet pour
      # rappeler un service qui tourne dans le conteneur d'à côté.
      - MAYA_BASE_URL=http://maya-dashboard:3850/admin-maya
