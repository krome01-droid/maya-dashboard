# ============================================
# MAYA Dashboard — Deploy to Hostinger VPS
# Étape 1 : build image → push GHCR
# Étape 2 : Hostinger pull image → run container
# ============================================
name: Deploy MAYA Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/krome01-droid/maya-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push maya-cron to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./cron
          push: true
          tags: ghcr.io/krome01-droid/maya-cron:latest
          cache-from: type=gha,scope=cron
          cache-to: type=gha,mode=max,scope=cron

      - name: Deploy to Hostinger VPS
        uses: hostinger/deploy-on-vps@v1
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          personal-token: ${{ secrets.GH_PAT }}
          project-name: maya-dashboard
          docker-compose-path: docker-compose.yml
          environment-variables: |
            NODE_ENV=production
            PORT=3850
            HOSTNAME=0.0.0.0
            NEXTAUTH_URL=https://agent.moto-ecole-inris.fr/admin-maya
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            ADMIN_USERNAME=${{ vars.ADMIN_USERNAME }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            SUPABASE_URL=https://ngjdoxiiipctmjewvrfu.supabase.co
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            CRON_SECRET=${{ secrets.CRON_SECRET }}
            CROME_INGEST_URL=https://lrutxrgpgmayqjepqoed.supabase.co/functions/v1/submit-post
            CROME_INGEST_SECRET=${{ secrets.CROME_INGEST_SECRET }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            BRIEF_TO=${{ vars.BRIEF_TO }}
            BRIEF_FROM=${{ vars.BRIEF_FROM }}
