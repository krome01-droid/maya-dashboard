# Diagnostic temporaire : quatre variables arrivent vides dans le conteneur
# alors que les secrets existent. Ce workflow n'affiche que des longueurs —
# jamais une valeur — pour distinguer « secret vide côté GitHub » de « valeur
# perdue en transit vers Hostinger ». À supprimer une fois la cause établie.
name: Diag secrets

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Longueurs des secrets
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CROME_INGEST_SECRET: ${{ secrets.CROME_INGEST_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          for v in NEXTAUTH_SECRET ADMIN_PASSWORD ANTHROPIC_API_KEY \
                   SUPABASE_SERVICE_ROLE_KEY SUPABASE_ANON_KEY \
                   CRON_SECRET CROME_INGEST_SECRET RESEND_API_KEY; do
            val="${!v}"
            lignes=$(printf '%s' "$val" | wc -l)
            printf '%-28s longueur=%-5s lignes_supp=%s\n' "$v" "${#val}" "$lignes"
          done
